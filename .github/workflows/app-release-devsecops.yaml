name: Release Pipeline (Build, Scan, Sign, Promote)

on:
  workflow_call:
    inputs:
      enable_code_scanning:
        description: "Enable upload-sarif steps"
        required: false
        type: boolean
        default: false
      enable_sbom_generation:
        description: "Enable SBOM generation for images"
        required: false
        type: boolean
        default: true
      enable_image_signing:
        description: "Enable Cosign image signing"
        required: false
        type: boolean
        default: true
      enable_multi_arch:
        description: "Enable multi-architecture builds"
        required: false
        type: boolean
        default: true
      enable_dockle:
        description: "Enable Dockle container image best practices scanning"
        required: false
        type: boolean
        default: true
      enable_dive:
        description: "Enable Dive image layer analysis"
        required: false
        type: boolean
        default: true
      enable_slsa_provenance:
        description: "Enable SLSA provenance generation"
        required: false
        type: boolean
        default: true
      enable_dependency_track:
        description: "Enable upload to Dependency-Track"
        required: false
        type: boolean
        default: false
      enforce_policies:
        description: "Fail workflow when policy thresholds are exceeded"
        required: false
        type: boolean
        default: true
      promote_to_latest:
        description: "Promote images to :latest tag (default branch only)"
        required: false
        type: boolean
        default: false
      run_comprehensive_sast:
        description: "Run comprehensive SAST (Semgrep) in release workflow"
        required: false
        type: boolean
        default: true
      enable_snyk:
        description: "Enable Snyk vulnerability scanning"
        required: false
        type: boolean
        default: false
      enable_socket:
        description: "Enable Socket.dev supply chain protection"
        required: false
        type: boolean
        default: true
      enable_owasp_dependency_check:
        description: "Enable OWASP Dependency-Check (Java backend only)"
        required: false
        type: boolean
        default: false
      enable_secrets_scanning:
        description: "Enable comprehensive secrets scanning"
        required: false
        type: boolean
        default: true
      enable_license_compliance:
        description: "Enable license compliance checking"
        required: false
        type: boolean
        default: true
      enable_supply_chain_security:
        description: "Enable supply chain security checks"
        required: false
        type: boolean
        default: true
      expected_signing_identity:
        required: true
        type: string


    secrets:
      DOCKERHUB_TOKEN:
        required: false
      DEPENDENCY_TRACK_URL:
        required: false
      DEPENDENCY_TRACK_API_KEY:
        required: false
      SEMGREP_APP_TOKEN:
        required: false
      SNYK_TOKEN:
        required: false
      NVD_API_KEY:
        required: false
      SOCKET_CLI_API_TOKEN:
        required: false

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.68.2"
  SYFT_VERSION: "v1.38.2"
  GRYPE_VERSION: "v0.77.2"
  COSIGN_VERSION: "2.3.0"
  DOCKLE_VERSION: "0.4.15"
  DIVE_VERSION: "0.13.1"
  SEMGREP_VERSION: "1.145.0"
  SNYK_VERSION: "1.1301.2"
  LICENSE_CHECKER_VERSION: "25.0.1"
  DEPENDENCY_CHECK_VERSION: "12.1.9"
  TRUFFLEHOG_TAG: "3.92.4"

  IMAGE_TAG: ${{ github.sha }}

  TRIVY_SEVERITY: "CRITICAL,HIGH"
  GRYPE_FAIL_SEVERITY: "high"
  DOCKLE_SEVERITY: "FATAL"

  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  BACKEND_IMAGE_REPO: ${{ vars.BACKEND_IMAGE_REPO }}
  FRONTEND_IMAGE_REPO: ${{ vars.FRONTEND_IMAGE_REPO }}

  SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
  SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}

  COSIGN_EXPERIMENTAL: "true"

  DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
  DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}

  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  BANNED_LICENSE_TOKENS: "GPL-3.0,AGPL-3.0,LGPL-3.0"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
      backend_dir: ${{ steps.detect.outputs.backend_dir }}
      frontend_dir: ${{ steps.detect.outputs.frontend_dir }}
      build_backend_image: ${{ steps.detect.outputs.build_backend_image }}
      build_frontend_image: ${{ steps.detect.outputs.build_frontend_image }}
      build_any_image: ${{ steps.detect.outputs.build_any_image }}
      backend_image_context: ${{ steps.detect.outputs.backend_image_context }}
      backend_image_dockerfile: ${{ steps.detect.outputs.backend_image_dockerfile }}
      frontend_image_context: ${{ steps.detect.outputs.frontend_image_context }}
      frontend_image_dockerfile: ${{ steps.detect.outputs.frontend_image_dockerfile }}
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect project structure
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_backend=false
          backend_dir="."
          for d in "." "backend" "api" "server"; do
            if [ -f "$d/pom.xml" ] || [ -d "$d/src/main/java" ] || [ -f "$d/build.gradle" ] || [ -f "$d/build.gradle.kts" ]; then
              has_backend=true
              backend_dir="$d"
              break
            fi
          done

          has_frontend=false
          frontend_dir="."
          for d in "." "frontend" "client" "web" "ui"; do
            is_node=false
            if [ -f "$d/package.json" ] || [ -f "$d/package-lock.json" ] || [ -f "$d/pnpm-lock.yaml" ] || [ -f "$d/yarn.lock" ]; then
              is_node=true
            fi

            is_ts_app=false
            if [ -f "$d/tsconfig.json" ] && { [ -d "$d/src" ] || [ -d "$d/src/app" ]; }; then
              is_ts_app=true
            fi

            is_framework=false
            if [ -f "$d/vite.config.js" ] || [ -f "$d/vite.config.ts" ] || [ -f "$d/next.config.js" ]; then
              is_framework=true
            fi

            if [ "$is_node" = "true" ] || [ "$is_ts_app" = "true" ] || [ "$is_framework" = "true" ]; then
              has_frontend=true
              frontend_dir="$d"
              break
            fi
          done

          root_dockerfile_exists=false
          if [ -f "Dockerfile" ]; then root_dockerfile_exists=true; fi

          build_backend_image=false
          backend_image_context=""
          backend_image_dockerfile=""

          if [ "$has_backend" = "true" ]; then
            for dockerfile in "$backend_dir/Dockerfile" "docker/backend/Dockerfile"; do
              if [ -f "$dockerfile" ]; then
                build_backend_image=true
                backend_image_dockerfile="$dockerfile"
                if [[ "$dockerfile" == "$backend_dir/"* ]]; then
                  backend_image_context="$backend_dir"
                else
                  backend_image_context="."
                fi
                break
              fi
            done

            if [ "$build_backend_image" = "false" ] && [ "$root_dockerfile_exists" = "true" ] && [ "$has_frontend" = "false" ]; then
              build_backend_image=true
              backend_image_context="."
              backend_image_dockerfile="Dockerfile"
            fi
          fi

          build_frontend_image=false
          frontend_image_context=""
          frontend_image_dockerfile=""

          if [ "$has_frontend" = "true" ]; then
            for dockerfile in "$frontend_dir/Dockerfile" "docker/frontend/Dockerfile"; do
              if [ -f "$dockerfile" ]; then
                build_frontend_image=true
                frontend_image_dockerfile="$dockerfile"
                if [[ "$dockerfile" == "$frontend_dir/"* ]]; then
                  frontend_image_context="$frontend_dir"
                else
                  frontend_image_context="."
                fi
                break
              fi
            done

            if [ "$build_frontend_image" = "false" ] && [ "$root_dockerfile_exists" = "true" ] && [ "$has_backend" = "false" ]; then
              build_frontend_image=true
              frontend_image_context="."
              frontend_image_dockerfile="Dockerfile"
            fi
          fi

          if [ "$build_backend_image" = "true" ] && [ "$build_frontend_image" = "true" ]; then
            if [ "$backend_image_context" = "$frontend_image_context" ] && [ "$backend_image_dockerfile" = "$frontend_image_dockerfile" ]; then
              echo "::error::Backend and frontend resolved to the same Dockerfile/context ($backend_image_dockerfile @ $backend_image_context). Provide distinct Dockerfiles or disable one build."
              exit 1
            fi
          fi

          build_any_image=false
          if [ "$build_backend_image" = "true" ] || [ "$build_frontend_image" = "true" ]; then
            build_any_image=true
          fi

          {
            echo "has_backend=$has_backend"
            echo "backend_dir=$backend_dir"
            echo "has_frontend=$has_frontend"
            echo "frontend_dir=$frontend_dir"

            echo "build_backend_image=$build_backend_image"
            echo "backend_image_context=$backend_image_context"
            echo "backend_image_dockerfile=$backend_image_dockerfile"

            echo "build_frontend_image=$build_frontend_image"
            echo "frontend_image_context=$frontend_image_context"
            echo "frontend_image_dockerfile=$frontend_image_dockerfile"

            echo "build_any_image=$build_any_image"
          } >> "$GITHUB_OUTPUT"

  pre-release-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect]
    permissions:
      contents: read
      security-events: write
      actions: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Semgrep for SAST
        if: inputs.run_comprehensive_sast
        run: |
          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir semgrep==${{ env.SEMGREP_VERSION }}
          semgrep --version

      - name: Run Semgrep SAST
        id: semgrep_release
        if: inputs.run_comprehensive_sast
        env:
          SEMGREP_APP_TOKEN: ${{ env.SEMGREP_APP_TOKEN }}
        run: |
          set -e
          if [ -n "${SEMGREP_APP_TOKEN:-}" ]; then
            semgrep ci --sarif --output semgrep-release.sarif || true
          else
            semgrep scan --config p/security-audit --sarif --output semgrep-release.sarif || true
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if not os.path.exists("semgrep-release.sarif"):
            print("sarif_exists=false")
            print("finding_count=0")
            raise SystemExit(0)
          try:
            d=json.load(open("semgrep-release.sarif"))
            results=[]
            for run in d.get("runs",[]):
              results += run.get("results",[]) or []
            print("sarif_exists=true")
            print(f"finding_count={len(results)}")
          except Exception:
            print("sarif_exists=false")
            print("finding_count=0")
          PY

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: true

      - name: Trivy filesystem vulnerability scan
        id: trivy_prebuild
        run: |
          trivy fs --scanners vuln --severity "${TRIVY_SEVERITY}" --exit-code 0 --no-progress --format table .
          trivy fs --scanners vuln --severity "${TRIVY_SEVERITY}" --exit-code 0 --no-progress --format sarif --output trivy-prebuild-vuln.sarif .

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.path.exists("trivy-prebuild-vuln.sarif"):
            try:
              d=json.load(open("trivy-prebuild-vuln.sarif"))
              count=sum(len(r.get("results",[]) or []) for r in d.get("runs",[]))
              print("sarif_exists=true")
              print(f"vuln_count={count}")
            except Exception:
              print("sarif_exists=false")
              print("vuln_count=0")
          else:
            print("sarif_exists=false")
            print("vuln_count=0")
          PY

      - name: Trivy secret scan
        if: inputs.enable_secrets_scanning
        id: trivy_secrets
        run: |
          trivy fs --scanners secret --format table --exit-code 0 --no-progress .
          trivy fs --scanners secret --format sarif --output trivy-secrets.sarif --exit-code 0 --no-progress .

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.path.exists("trivy-secrets.sarif"):
            try:
              d=json.load(open("trivy-secrets.sarif"))
              count=sum(len(r.get("results",[]) or []) for r in d.get("runs",[]))
              print("secret_sarif_exists=true")
              print(f"secret_count={count}")
            except Exception:
              print("secret_sarif_exists=false")
              print("secret_count=0")
          else:
            print("secret_sarif_exists=false")
            print("secret_count=0")
          PY

      - name: Gitleaks secrets scan
        if: inputs.enable_secrets_scanning
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog secrets scan
        if: inputs.enable_secrets_scanning
        id: trufflehog
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$(pwd):/workdir" ghcr.io/trufflesecurity/trufflehog:${{ env.TRUFFLEHOG_TAG }} \
            filesystem /workdir --only-verified 2>&1 | tee trufflehog.log
          tail -200 trufflehog.log

      - name: Set up JDK (backend)
        if: needs.detect.outputs.has_backend == 'true'
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Detect frontend package manager
        if: needs.detect.outputs.has_frontend == 'true'
        id: fe_pm
        working-directory: ${{ needs.detect.outputs.frontend_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lock=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lock=yarn.lock" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lock=package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js (frontend)
        if: needs.detect.outputs.has_frontend == 'true'
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: "20"
          cache: ${{ steps.fe_pm.outputs.pm }}
          cache-dependency-path: |
            ${{ needs.detect.outputs.frontend_dir }}/${{ steps.fe_pm.outputs.lock }}

      - name: Set Dependency-Check data directory
        if: inputs.enable_owasp_dependency_check && needs.detect.outputs.has_backend == 'true'
        run: echo "DEPENDENCY_CHECK_DATA=${RUNNER_TEMP}/dependency-check" >> "$GITHUB_ENV"

      - name: Cache OWASP Dependency-Check data
        id: depcheck_cache
        if: inputs.enable_owasp_dependency_check && needs.detect.outputs.has_backend == 'true'
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: ${{ runner.temp }}/dependency-check
          key: depcheck-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ hashFiles('**/pom.xml', '**/build.gradle', '**/build.gradle.kts') }}
          restore-keys: |
            depcheck-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-

      - name: Maven dependency check
        id: depcheck
        continue-on-error: true
        if: inputs.enable_owasp_dependency_check && needs.detect.outputs.has_backend == 'true'
        working-directory: ${{ needs.detect.outputs.backend_dir }}
        run: |
          set -e
          DEPENDENCY_CHECK_DATA="${RUNNER_TEMP}/dependency-check"
          mkdir -p "${DEPENDENCY_CHECK_DATA}"

          AUTO_UPDATE=true
          if [ "${{ steps.depcheck_cache.outputs.cache-hit }}" = "true" ] && [ -f "${DEPENDENCY_CHECK_DATA}/odc.mv.db" ]; then
            CACHE_AGE_SECONDS=$(($(date +%s) - $(stat -c %Y "${DEPENDENCY_CHECK_DATA}/odc.mv.db")))
            CACHE_AGE_HOURS=$((CACHE_AGE_SECONDS / 3600))
            if [ $CACHE_AGE_HOURS -lt 24 ]; then
              AUTO_UPDATE=false
            fi
          fi

          EXTRA_NVD=""
          if [ -n "${NVD_API_KEY}" ]; then
            EXTRA_NVD="-DnvdApiKeyEnvironmentVariable=NVD_API_KEY"
          fi

          SUPPRESS_ARG=""
          if [ -f "dependency-check-suppressions.xml" ]; then
            SUPPRESS_ARG="-DsuppressionFiles=dependency-check-suppressions.xml"
          fi

          if [ -f "pom.xml" ]; then
            mvn -B -ntp org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:check \
              -DfailBuildOnCVSS=7 \
              -DdataDirectory="${DEPENDENCY_CHECK_DATA}" \
              -DautoUpdate="${AUTO_UPDATE}" \
              -Dformat=HTML,JSON,SARIF \
              ${SUPPRESS_ARG} \
              ${EXTRA_NVD}
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            ./gradlew dependencyCheckAnalyze \
              -DdependencyCheck.data.directory="${DEPENDENCY_CHECK_DATA}" \
              -DdependencyCheck.autoUpdate="${AUTO_UPDATE}" \
              -DdependencyCheck.format=HTML,JSON,SARIF \
              -DdependencyCheck.failBuildOnCVSS=7 \
              ${EXTRA_NVD}
          else
            echo "No build file found for dependency-check"
          fi

      - name: Install frontend dependencies
        if: needs.detect.outputs.has_frontend == 'true'
        working-directory: ${{ needs.detect.outputs.frontend_dir }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable || true
          pm="${{ steps.fe_pm.outputs.pm }}"
          if [ "$pm" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$pm" = "yarn" ]; then
            yver="$(yarn --version | cut -d. -f1)"
            if [ "${yver:-1}" -ge 2 ]; then
              YARN_NODE_LINKER=node-modules yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
          else
            npm ci --prefer-offline --no-audit --no-fund
          fi

      - name: npm audit
        if: needs.detect.outputs.has_frontend == 'true' && steps.fe_pm.outputs.pm == 'npm'
        id: npm_audit
        working-directory: ${{ needs.detect.outputs.frontend_dir }}
        run: |
          set -euo pipefail
          npm audit --audit-level=high --json > npm-audit.json 2>/dev/null || true

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
            with open("npm-audit.json", "r") as f:
              data=json.load(f)
              vul=data.get("metadata",{}).get("vulnerabilities",{})
              high=int(vul.get("high",0) or 0)
              critical=int(vul.get("critical",0) or 0)
              print(f"high={high}")
              print(f"critical={critical}")
              print(f"high_critical_total={high+critical}")
          except Exception:
            print("high=0")
            print("critical=0")
            print("high_critical_total=0")
          PY

      - name: Socket.dev supply chain protection
        id: socket_ci
        continue-on-error: true
        if: inputs.enable_socket && needs.detect.outputs.has_frontend == 'true' && env.SOCKET_CLI_API_TOKEN != ''
        working-directory: ${{ needs.detect.outputs.frontend_dir }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOCKET_CLI_API_TOKEN: ${{ env.SOCKET_CLI_API_TOKEN }}
          SOCKET_SECURITY_API_TOKEN: ${{ env.SOCKET_CLI_API_TOKEN }}
        run: |
          npm exec --yes --package=@socketsecurity/cli@1.1.49 -- socket ci

      - name: Socket.dev skipped
        if: inputs.enable_socket && needs.detect.outputs.has_frontend == 'true' && env.SOCKET_CLI_API_TOKEN == ''
        run: |
          echo "::warning::Socket.dev is enabled but SOCKET_CLI_API_TOKEN is not set."

      - name: Install Snyk CLI
        if: inputs.enable_snyk && env.SNYK_TOKEN != ''
        run: |
          npm install -g snyk@${{ env.SNYK_VERSION }}
          snyk --version

      - name: Snyk backend test
        if: inputs.enable_snyk && env.SNYK_TOKEN != '' && needs.detect.outputs.has_backend == 'true'
        working-directory: ${{ needs.detect.outputs.backend_dir }}
        id: snyk_backend
        run: |
          snyk test --severity-threshold=high --sarif-file-output="$GITHUB_WORKSPACE/snyk-backend.sarif"

      - name: Snyk frontend test
        if: inputs.enable_snyk && env.SNYK_TOKEN != '' && needs.detect.outputs.has_frontend == 'true'
        working-directory: ${{ needs.detect.outputs.frontend_dir }}
        id: snyk_frontend
        run: |
          snyk test --severity-threshold=high --sarif-file-output="$GITHUB_WORKSPACE/snyk-frontend.sarif"


      - name: Upload Semgrep SARIF artifact
        if: steps.semgrep_release.outputs.sarif_exists == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: semgrep-release
          path: semgrep-release.sarif
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Trivy pre-build SARIF artifact
        if: steps.trivy_prebuild.outputs.sarif_exists == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: trivy-prebuild-vuln
          path: trivy-prebuild-vuln.sarif
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Trivy secrets SARIF artifact
        if: steps.trivy_secrets.outputs.secret_sarif_exists == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: trivy-secrets
          path: trivy-secrets.sarif
          retention-days: 90
          if-no-files-found: ignore

      - name: Check dependency-check reports exist
        id: depcheck_reports
        if: always()
        run: |
          set -euo pipefail
          exists=false
          sarif_path=""
          if [ "${{ needs.detect.outputs.has_backend }}" = "true" ]; then
            base="${{ needs.detect.outputs.backend_dir }}"
            for f in \
              "$base/target/dependency-check-report.sarif" \
              "$base/build/reports/dependency-check-report.sarif"
            do
              if [ -f "$f" ]; then
                exists=true
                sarif_path="$f"
                break
              fi
            done
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "sarif_path=$sarif_path" >> "$GITHUB_OUTPUT"

      - name: Upload OWASP SARIF to code scanning
        if: inputs.enable_code_scanning && steps.depcheck_reports.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: ${{ steps.depcheck_reports.outputs.sarif_path }}
          category: owasp-dependency-check-release

      - name: Upload dependency-check reports
        if: steps.depcheck_reports.outputs.exists == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dependency-check
          path: |
            ${{ needs.detect.outputs.backend_dir }}/target/dependency-check-report.*
            ${{ needs.detect.outputs.backend_dir }}/build/reports/dependency-check-report.*
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Snyk SARIF artifacts
        if: always() && inputs.enable_snyk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: snyk-sarifs
          path: |
            snyk-backend.sarif
            snyk-frontend.sarif
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Semgrep SARIF to code scanning
        if: inputs.enable_code_scanning && steps.semgrep_release.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: semgrep-release.sarif
          category: semgrep-release

      - name: Upload Trivy pre-build SARIF to code scanning
        if: inputs.enable_code_scanning && steps.trivy_prebuild.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: trivy-prebuild-vuln.sarif
          category: trivy-prebuild-release

      - name: Upload Trivy secrets SARIF to code scanning
        if: inputs.enable_code_scanning && steps.trivy_secrets.outputs.secret_sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets-release

      - name: Upload Snyk SARIF to code scanning (backend)
        if: inputs.enable_code_scanning && hashFiles('snyk-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: snyk-backend.sarif
          category: snyk-backend-release

      - name: Upload Snyk SARIF to code scanning (frontend)
        if: inputs.enable_code_scanning && hashFiles('snyk-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: snyk-frontend.sarif
          category: snyk-frontend-release

      - name: Evaluate pre-release security
        if: always() && inputs.enforce_policies
        env:
          HAS_BACKEND: ${{ needs.detect.outputs.has_backend }}
          HAS_FRONTEND: ${{ needs.detect.outputs.has_frontend }}
          TRIVY_PREBUILD_COUNT: ${{ steps.trivy_prebuild.outputs.vuln_count }}
          TRIVY_SECRET_COUNT: ${{ steps.trivy_secrets.outputs.secret_count }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog.outcome }}
          SEMGREP_FINDING_COUNT: ${{ steps.semgrep_release.outputs.finding_count }}
          SOCKET_OUTCOME: ${{ steps.socket_ci.outcome }}
          DEPCHECK_ENABLED: ${{ inputs.enable_owasp_dependency_check }}
          DEPCHECK_OUTCOME: ${{ steps.depcheck.outcome }}
          NPM_AUDIT_HC: ${{ steps.npm_audit.outputs.high_critical_total }}
          SNYK_BACKEND_OUTCOME: ${{ steps.snyk_backend.outcome }}
          SNYK_FRONTEND_OUTCOME: ${{ steps.snyk_frontend.outcome }}
        run: |
          failures=0

          if [ "${TRIVY_PREBUILD_COUNT:-0}" -ne 0 ]; then
            echo "::error::Trivy pre-build scan found CRITICAL/HIGH vulnerabilities (count=${TRIVY_PREBUILD_COUNT})"
            failures=1
          fi

          if [ "${{ inputs.enable_secrets_scanning }}" = "true" ]; then
            if [ "${TRIVY_SECRET_COUNT:-0}" -ne 0 ]; then
              echo "::error::Trivy found secrets in filesystem (count=${TRIVY_SECRET_COUNT})"
              failures=1
            fi
            if [ "${GITLEAKS_OUTCOME}" = "failure" ]; then
              echo "::error::Gitleaks found secrets"
              failures=1
            fi
            if [ "${TRUFFLEHOG_OUTCOME}" = "failure" ]; then
              echo "::error::TruffleHog found verified secrets (or scan failed)"
              failures=1
            fi
          fi

          if [ "${SEMGREP_FINDING_COUNT:-0}" -gt 0 ]; then
            echo "::error::Semgrep found ${SEMGREP_FINDING_COUNT} security findings"
            failures=1
          fi

          if [ "${HAS_BACKEND}" = "true" ] && [ "${DEPCHECK_ENABLED}" = "true" ]; then
            if [ "${DEPCHECK_OUTCOME}" = "failure" ]; then
              echo "::error::Dependency check failed policy"
              failures=1
            fi
          fi

          if [ "${HAS_FRONTEND}" = "true" ] && [ "${NPM_AUDIT_HC:-0}" -ne 0 ]; then
            echo "::error::NPM audit found high/critical vulnerabilities (high+critical=${NPM_AUDIT_HC})"
            failures=1
          fi

          if [ "${{ inputs.enable_snyk }}" = "true" ]; then
            if [ "${HAS_BACKEND}" = "true" ] && [ "${SNYK_BACKEND_OUTCOME}" = "failure" ]; then
              echo "::error::Snyk backend scan found HIGH+ severity vulnerabilities"
              failures=1
            fi
            if [ "${HAS_FRONTEND}" = "true" ] && [ "${SNYK_FRONTEND_OUTCOME}" = "failure" ]; then
              echo "::error::Snyk frontend scan found HIGH+ severity vulnerabilities"
              failures=1
            fi
          fi
          if [ "${{ inputs.enable_socket }}" = "true" ] && [ -n "${{ env.SOCKET_CLI_API_TOKEN }}" ]; then
            if [ "${SOCKET_OUTCOME}" = "failure" ]; then
              echo "::error::Socket.dev policy failed"
              failures=1
            fi
          fi
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

  license-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect]
    if: inputs.enable_license_compliance
    permissions:
      contents: read
      actions: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Set up JDK (backend)
        if: needs.detect.outputs.has_backend == 'true'
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Detect frontend package manager
        if: needs.detect.outputs.has_frontend == 'true'
        id: fe_pm
        working-directory: ${{ needs.detect.outputs.frontend_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"; echo "lock=pnpm-lock.yaml" >> "$GITHUB_OUTPUT";
          elif [ -f yarn.lock ]; then echo "pm=yarn" >> "$GITHUB_OUTPUT"; echo "lock=yarn.lock" >> "$GITHUB_OUTPUT";
          else echo "pm=npm" >> "$GITHUB_OUTPUT"; echo "lock=package-lock.json" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node.js (frontend)
        if: needs.detect.outputs.has_frontend == 'true'
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: "20"
          cache: ${{ steps.fe_pm.outputs.pm }}
          cache-dependency-path: |
            ${{ needs.detect.outputs.frontend_dir }}/${{ steps.fe_pm.outputs.lock }}

      - name: Install frontend dependencies
        if: needs.detect.outputs.has_frontend == 'true'
        working-directory: ${{ needs.detect.outputs.frontend_dir }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable || true
          pm="${{ steps.fe_pm.outputs.pm }}"
          if [ "$pm" = "pnpm" ]; then pnpm install --frozen-lockfile
          elif [ "$pm" = "yarn" ]; then
            yver="$(yarn --version | cut -d. -f1)"
            if [ "${yver:-1}" -ge 2 ]; then
              YARN_NODE_LINKER=node-modules yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
          else npm ci --prefer-offline --no-audit --no-fund; fi

      - name: Maven license check
        if: needs.detect.outputs.has_backend == 'true'
        id: maven_license
        working-directory: ${{ needs.detect.outputs.backend_dir }}
        run: |
          set -e
          banned_found=false

          if [ -f "pom.xml" ]; then
            mvn -B -ntp license:add-third-party \
              -Dlicense.excludedScopes=test,provided \
              -Dlicense.outputDirectory=target/generated-sources/license \
              -Dlicense.thirdPartyFilename=THIRD-PARTY.txt \
              -Dskip=false 2>&1 | grep -v "Parameter 'skip' is unknown" || true
          fi

          if [ -f "target/generated-sources/license/THIRD-PARTY.txt" ]; then
            LIC_FILE="target/generated-sources/license/THIRD-PARTY.txt"
            IFS=',' read -r -a TOKENS <<< "${BANNED_LICENSE_TOKENS}"
            for token in "${TOKENS[@]}"; do
              if grep -iq "$token" "$LIC_FILE"; then
                echo "::error::Found banned license token '$token' in: $LIC_FILE"
                banned_found=true
              fi
            done
          else
            echo "::warning::No THIRD-PARTY.txt generated"
          fi

          echo "banned_found=$banned_found" >> "$GITHUB_OUTPUT"

      - name: npm license report
        if: needs.detect.outputs.has_frontend == 'true'
        id: npm_license
        working-directory: ${{ needs.detect.outputs.frontend_dir }}
        run: |
          set -euo pipefail
          npm exec --yes --package=license-checker@${{ env.LICENSE_CHECKER_VERSION }} -- \
            license-checker --json --out licenses.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          banned=os.environ.get("BANNED_LICENSE_TOKENS","").split(",")
          banned=[b.strip() for b in banned if b.strip()]
          try:
            data=json.load(open("licenses.json","r",encoding="utf-8"))
          except Exception:
            print("banned_count=0")
            sys.exit(0)
          bad=[]
          for pkg, info in data.items():
            lic=info.get("licenses","")
            s=";".join(lic) if isinstance(lic,list) else str(lic)
            if any(tok.lower() in s.lower() for tok in banned):
              bad.append((pkg,s))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
            f.write(f"banned_count={len(bad)}\n")
          PY

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: license-reports
          path: |
            ${{ needs.detect.outputs.backend_dir }}/target/generated-sources/license/THIRD-PARTY.txt
            ${{ needs.detect.outputs.frontend_dir }}/licenses.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Evaluate license compliance
        if: always() && inputs.enforce_policies
        env:
          MAVEN_BANNED: ${{ steps.maven_license.outputs.banned_found }}
          NPM_BANNED_COUNT: ${{ steps.npm_license.outputs.banned_count }}
        run: |
          failures=0
          if [ "${MAVEN_BANNED}" = "true" ]; then
            echo "::error::Maven dependencies contain banned licenses"
            failures=1
          fi
          if [ "${NPM_BANNED_COUNT:-0}" -ne 0 ]; then
            echo "::error::NPM dependencies contain banned licenses; count=${NPM_BANNED_COUNT}"
            failures=1
          fi
          if [ "$failures" -ne 0 ]; then exit 1; fi

  supply-chain-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect]
    if: inputs.enable_supply_chain_security && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      security-events: write
      id-token: write
      issues: read
      pull-requests: read
      checks: read


    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenSSF Scorecard (JSON)
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false

      - name: Evaluate Scorecard policy
        if: github.ref_name == github.event.repository.default_branch
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('scorecard.json'))
          overall=data.get('score',0)
          checks=data.get('checks',[])
          if overall < 7.0:
            raise SystemExit(1)
          critical=['Security-Policy','SAST','Branch-Protection','Pinned-Dependencies']
          for c in checks:
            if c.get('name') in critical and (c.get('score') or 0) < 7:
              raise SystemExit(1)
          PY

      - name: Run OpenSSF Scorecard (SARIF)
        if: inputs.enable_code_scanning
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF to code scanning
        if: inputs.enable_code_scanning && hashFiles('scorecard.sarif') != ''
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: scorecard.sarif
          category: scorecard-release

  build-and-push-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [detect, pre-release-security, license-compliance, supply-chain-security]
    if: >-
      ${{
        always()
        && needs.detect.outputs.build_any_image == 'true'
        && needs.pre-release-security.result == 'success'
        && ( inputs.enable_license_compliance == false || needs.license-compliance.result == 'success' )
        && (
          github.ref_name != github.event.repository.default_branch
          || inputs.enable_supply_chain_security == false
          || needs.supply-chain-security.result == 'success'
        )
      }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: write

    outputs:
      registry: ${{ steps.set-images.outputs.registry }}
      namespace: ${{ steps.set-images.outputs.namespace }}

      backend_repo: ${{ steps.set-images.outputs.backend_repo }}
      frontend_repo: ${{ steps.set-images.outputs.frontend_repo }}

      backend_image_name: ${{ steps.set-images.outputs.backend_image_name }}
      frontend_image_name: ${{ steps.set-images.outputs.frontend_image_name }}

      backend_digest: ${{ steps.backend-build.outputs.digest }}
      frontend_digest: ${{ steps.frontend-build.outputs.digest }}

      backend_digest_ref: ${{ steps.digest-refs.outputs.backend_digest_ref }}
      frontend_digest_ref: ${{ steps.digest-refs.outputs.frontend_digest_ref }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Set image names
        id: set-images
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN must be set (Docker Hub only mode)."
            exit 1
          fi

          clean() {
            printf '%s' "$1" \
              | tr -d '\r\n' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d '[:space:]'
          }

          REGISTRY="docker.io"
          NAMESPACE="$(clean "${DOCKERHUB_USERNAME}")"

          normalize_repo_component() {
            local input="${1:-}"
            local fallback="${2:-}"
            local v="${input:-$fallback}"

            v="$(printf '%s' "$v" | tr -d '\r\n')"
            v="${v%%@*}"
            v="${v%%:*}"
            v="${v##*/}"
            v="$(clean "$v")"

            if [ -z "$v" ]; then
              v="$(clean "$fallback")"
            fi

            v="$(printf '%s' "$v" | tr -cd 'a-z0-9._-')"
            if [ -z "$v" ]; then
              echo "::error::Resolved repo component is empty/invalid. Check BACKEND_IMAGE_REPO/FRONTEND_IMAGE_REPO secrets."
              exit 1
            fi

            printf '%s' "$v"
          }

          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          BACKEND_COMP="$(normalize_repo_component "${BACKEND_IMAGE_REPO:-}" "${REPO_NAME}-backend")"
          FRONTEND_COMP="$(normalize_repo_component "${FRONTEND_IMAGE_REPO:-}" "${REPO_NAME}-frontend")"

          BACKEND_REPO="${REGISTRY}/${NAMESPACE}/${BACKEND_COMP}"
          FRONTEND_REPO="${REGISTRY}/${NAMESPACE}/${FRONTEND_COMP}"

          BACKEND_IMAGE_NAME="${BACKEND_REPO}:${IMAGE_TAG}"
          FRONTEND_IMAGE_NAME="${FRONTEND_REPO}:${IMAGE_TAG}"

          for x in "$BACKEND_REPO" "$FRONTEND_REPO" "$BACKEND_IMAGE_NAME" "$FRONTEND_IMAGE_NAME"; do
            if printf '%s' "$x" | grep -q $'[\r\n]'; then
              echo "::error::Image reference contains CR/LF (newline). Re-save DOCKERHUB_USERNAME/BACKEND_IMAGE_REPO/FRONTEND_IMAGE_REPO secrets without line breaks."
              exit 1
            fi
          done

          {
            echo "registry=${REGISTRY}"
            echo "namespace=${NAMESPACE}"
            echo "backend_repo=${BACKEND_REPO}"
            echo "frontend_repo=${FRONTEND_REPO}"
            echo "backend_image_name=${BACKEND_IMAGE_NAME}"
            echo "frontend_image_name=${FRONTEND_IMAGE_NAME}"
          } >> "$GITHUB_OUTPUT"


      - name: Set up QEMU
        if: inputs.enable_multi_arch
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        id: backend-build
        if: needs.detect.outputs.build_backend_image == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ${{ needs.detect.outputs.backend_image_context }}
          file: ${{ needs.detect.outputs.backend_image_dockerfile }}
          push: true
          platforms: ${{ inputs.enable_multi_arch && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags:  ${{ steps.set-images.outputs.backend_image_name }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ inputs.enable_slsa_provenance && 'true' || 'false' }}
          sbom: ${{ inputs.enable_sbom_generation && 'true' || 'false' }}
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        id: frontend-build
        if: needs.detect.outputs.build_frontend_image == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ${{ needs.detect.outputs.frontend_image_context }}
          file: ${{ needs.detect.outputs.frontend_image_dockerfile }}
          push: true
          platforms: ${{ inputs.enable_multi_arch && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.set-images.outputs.frontend_image_name }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ inputs.enable_slsa_provenance && 'true' || 'false' }}
          sbom: ${{ inputs.enable_sbom_generation && 'true' || 'false' }}
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}

      - name: Finalize digest refs
        id: digest-refs
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.detect.outputs.build_backend_image }}" = "true" ] && [ -n "${{ steps.backend-build.outputs.digest }}" ]; then
            echo "backend_digest_ref=${{ steps.set-images.outputs.backend_repo }}@${{ steps.backend-build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ needs.detect.outputs.build_frontend_image }}" = "true" ] && [ -n "${{ steps.frontend-build.outputs.digest }}" ]; then
            echo "frontend_digest_ref=${{ steps.set-images.outputs.frontend_repo }}@${{ steps.frontend-build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

  image-security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [detect, build-and-push-images]
    if: >-
      ${{
        always()
        && needs.detect.outputs.build_any_image == 'true'
        && needs.build-and-push-images.result == 'success'
      }}
    permissions:
      contents: read
      security-events: write
      id-token: write
      packages: write
      actions: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: true

      - name: Prepare local bin dir (Syft/Grype)
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="${RUNNER_TEMP}/bin"
          mkdir -p "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"

      - name: Install Syft
        if: inputs.enable_sbom_generation
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$BIN_DIR" "${{ env.SYFT_VERSION }}"
          syft version

      - name: Install Grype
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b "$BIN_DIR" "${{ env.GRYPE_VERSION }}"
          grype version

      - name: Install Cosign
        if: inputs.enable_image_signing
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}

      - name: Install Dockle
        if: inputs.enable_dockle
        run: |
          set -euo pipefail
          ver="${DOCKLE_VERSION}"
          curl -fsSL -o /tmp/dockle.tgz \
            "https://github.com/goodwithtech/dockle/releases/download/v${ver}/dockle_${ver}_Linux-64bit.tar.gz"
          tar -C /tmp -xzf /tmp/dockle.tgz dockle
          sudo install -m 0755 /tmp/dockle /usr/local/bin/dockle
          dockle --version

      - name: Install Dive
        if: inputs.enable_dive
        run: |
          wget -q https://github.com/wagoodman/dive/releases/download/v${{ env.DIVE_VERSION }}/dive_${{ env.DIVE_VERSION }}_linux_amd64.deb
          sudo apt-get install -y -f ./dive_${{ env.DIVE_VERSION }}_linux_amd64.deb
          rm -f dive_${{ env.DIVE_VERSION }}_linux_amd64.deb
          dive --version
          
      - name: Set up Node.js
        if: inputs.enable_snyk && env.SNYK_TOKEN != ''
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: "20"

      - name: Install Snyk CLI
        if: inputs.enable_snyk && env.SNYK_TOKEN != ''
        run: |
          npm install -g snyk@${{ env.SNYK_VERSION }}
          snyk --version

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Generate backend SBOM with Syft
        if: inputs.enable_sbom_generation && needs.detect.outputs.build_backend_image == 'true'
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.backend_repo }}@${{ needs.build-and-push-images.outputs.backend_digest }}"
          echo "Backend SBOM REF=$REF"
          [ -n "$REF" ] || { echo "::error::Backend image reference is empty"; exit 1; }
          syft --from registry "$REF" -o cyclonedx-json=backend-release-sbom.cdx.json
          syft --from registry "$REF" -o spdx-json=backend-release-sbom.spdx.json

      - name: Generate frontend SBOM with Syft
        if: inputs.enable_sbom_generation && needs.detect.outputs.build_frontend_image == 'true'
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.frontend_repo }}@${{ needs.build-and-push-images.outputs.frontend_digest }}"
          echo "Frontend SBOM REF=$REF"
          syft --from registry "$REF" -o cyclonedx-json=frontend-release-sbom.cdx.json
          syft --from registry "$REF" -o spdx-json=frontend-release-sbom.spdx.json

      - name: Validate SBOM quality
        if: inputs.enable_sbom_generation
        run: |
          set -euo pipefail
          validate_sbom() {
            local sbom_file=$1
            jq -e '.metadata and .components' "$sbom_file" > /dev/null
            local count
            count=$(jq '.components | length' "$sbom_file")
            [ "$count" -gt 0 ]
          }
          if [ -f "backend-release-sbom.cdx.json" ]; then validate_sbom "backend-release-sbom.cdx.json"; fi
          if [ -f "frontend-release-sbom.cdx.json" ]; then validate_sbom "frontend-release-sbom.cdx.json"; fi

      - name: Upload SBOM to Dependency-Track
        if: inputs.enable_dependency_track && env.DEPENDENCY_TRACK_URL != '' && env.DEPENDENCY_TRACK_API_KEY != ''
        run: |
          set -euo pipefail

          upload_bom() {
            local sbom_file="$1"
            local project_name="$2"
            local project_version="$3"

            curl -sS -X POST \
              -H "X-Api-Key: $DEPENDENCY_TRACK_API_KEY" \
              -F "autoCreate=true" \
              -F "projectName=$project_name" \
              -F "projectVersion=$project_version" \
              -F "bom=@$sbom_file" \
              "$DEPENDENCY_TRACK_URL/api/v1/bom" > /dev/null
          }

          base="${GITHUB_REPOSITORY//\//-}"

          if [ -f "backend-release-sbom.cdx.json" ]; then
            upload_bom "backend-release-sbom.cdx.json" "${base}-backend" "${IMAGE_TAG}"
          fi

          if [ -f "frontend-release-sbom.cdx.json" ]; then
            upload_bom "frontend-release-sbom.cdx.json" "${base}-frontend" "${IMAGE_TAG}"
          fi

      - name: Pull images for local scanners (Dockle/Dive)
        if: inputs.enable_dockle || inputs.enable_dive
        run: |
          set -euo pipefail
          if [ "${{ needs.detect.outputs.build_backend_image }}" = "true" ]; then
            docker pull --platform linux/amd64 "${{ needs.build-and-push-images.outputs.backend_image_name }}"
          fi
          if [ "${{ needs.detect.outputs.build_frontend_image }}" = "true" ]; then
            docker pull --platform linux/amd64 "${{ needs.build-and-push-images.outputs.frontend_image_name }}"
          fi

      - name: Snyk container test (backend)
        if: inputs.enable_snyk && env.SNYK_TOKEN != '' && needs.detect.outputs.build_backend_image == 'true'
        id: snyk_container_backend
        run: |
          REF="${{ needs.build-and-push-images.outputs.backend_repo }}@${{ needs.build-and-push-images.outputs.backend_digest }}"
          snyk container test "$REF" --severity-threshold=high --sarif-file-output=snyk-container-backend.sarif

      - name: Snyk container test (frontend)
        if: inputs.enable_snyk && env.SNYK_TOKEN != '' && needs.detect.outputs.build_frontend_image == 'true'
        id: snyk_container_frontend
        run: |
          REF="${{ needs.build-and-push-images.outputs.frontend_repo }}@${{ needs.build-and-push-images.outputs.frontend_digest }}"
          snyk container test "$REF" --severity-threshold=high --sarif-file-output=snyk-container-frontend.sarif

      - name: Trivy scan backend image
        if: needs.detect.outputs.build_backend_image == 'true'
        id: trivy_backend_image
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.backend_repo }}@${{ needs.build-and-push-images.outputs.backend_digest }}"
          trivy image --severity "${TRIVY_SEVERITY}" --exit-code 0 --no-progress --format table "$REF"
          trivy image --severity "${TRIVY_SEVERITY}" --exit-code 0 --no-progress --format sarif --output trivy-backend-release.sarif "$REF"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.path.exists("trivy-backend-release.sarif"):
            try:
              d=json.load(open("trivy-backend-release.sarif"))
              count=sum(len(r.get("results",[]) or []) for r in d.get("runs",[]))
              print("sarif_exists=true")
              print(f"vuln_count={count}")
            except Exception:
              print("sarif_exists=false")
              print("vuln_count=0")
          else:
            print("sarif_exists=false")
            print("vuln_count=0")
          PY

      - name: Trivy scan frontend image
        if: needs.detect.outputs.build_frontend_image == 'true'
        id: trivy_frontend_image
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.frontend_repo }}@${{ needs.build-and-push-images.outputs.frontend_digest }}"
          trivy image --severity "${TRIVY_SEVERITY}" --exit-code 0 --no-progress --format table "$REF"
          trivy image --severity "${TRIVY_SEVERITY}" --exit-code 0 --no-progress --format sarif --output trivy-frontend-release.sarif "$REF"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          if os.path.exists("trivy-frontend-release.sarif"):
            try:
              d=json.load(open("trivy-frontend-release.sarif"))
              count=sum(len(r.get("results",[]) or []) for r in d.get("runs",[]))
              print("sarif_exists=true")
              print(f"vuln_count={count}")
            except Exception:
              print("sarif_exists=false")
              print("vuln_count=0")
          else:
            print("sarif_exists=false")
            print("vuln_count=0")
          PY

      - name: Grype scan backend image
        if: needs.detect.outputs.build_backend_image == 'true'
        id: grype_backend_image
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.backend_digest_ref }}"

          tmp="$(mktemp)"
          set +e
          grype "$REF" --fail-on "${GRYPE_FAIL_SEVERITY}" -o table | tee "$tmp"
          rc=$?
          set -e

          echo ""
          echo "Showing only HIGH/CRITICAL findings:"
          { head -n 2 "$tmp"; grep -E '\s(High|Critical)\s*$' "$tmp" || true; }

          grype "$REF" -o sarif --file grype-backend-release.sarif || true
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Grype scan frontend image
        if: needs.detect.outputs.build_frontend_image == 'true'
        id: grype_frontend_image
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.frontend_digest_ref }}"

          tmp="$(mktemp)"
          set +e
          grype "$REF" --fail-on "${GRYPE_FAIL_SEVERITY}" -o table | tee "$tmp"
          rc=$?
          set -e

          echo ""
          echo "Showing only HIGH/CRITICAL findings:"
          { head -n 2 "$tmp"; grep -E '\s(High|Critical)\s*$' "$tmp" || true; }

          grype "$REF" -o sarif --file grype-frontend-release.sarif || true
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"


      - name: Dockle scan backend image
        if: inputs.enable_dockle && needs.detect.outputs.build_backend_image == 'true'
        id: dockle_backend_image
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.backend_image_name }}"
          set +e
          dockle --exit-level "${DOCKLE_SEVERITY}" --exit-code 1 --format json --output dockle-backend-report.json "$REF"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ -f "dockle-backend-report.json" ]; then
            jq -r '.details[]? | "\(.code): \(.title) (Level: \(.level))"' dockle-backend-report.json || true
            jq -r '.summary? // empty' dockle-backend-report.json || true
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::warning::Dockle backend failed threshold (exit=$rc)"
          fi

      - name: Dockle scan frontend image
        if: inputs.enable_dockle && needs.detect.outputs.build_frontend_image == 'true'
        id: dockle_frontend_image
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.frontend_image_name }}"
          set +e
          dockle --exit-level "${DOCKLE_SEVERITY}" --exit-code 1 --format json --output dockle-frontend-report.json "$REF"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ -f "dockle-frontend-report.json" ]; then
            jq -r '.details[]? | "\(.code): \(.title) (Level: \(.level))"' dockle-frontend-report.json || true
            jq -r '.summary? // empty' dockle-frontend-report.json || true
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::warning::Dockle frontend failed threshold (exit=$rc)"
          fi

      - name: Dive analysis backend image
        if: inputs.enable_dive && needs.detect.outputs.build_backend_image == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.backend_image_name }}"
          CI=true dive --source docker "$REF" --ci --lowestEfficiency=0.8 || true

      - name: Dive analysis frontend image
        if: inputs.enable_dive && needs.detect.outputs.build_frontend_image == 'true'
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.frontend_image_name }}"
          CI=true dive --source docker "$REF" --ci --lowestEfficiency=0.8 || true

      - name: Upload release SBOMs
        if: always() && inputs.enable_sbom_generation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-sboms
          path: |
            *-release-sbom.cdx.json
            *-release-sbom.spdx.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Trivy image SARIFs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: trivy-image-sarifs
          path: trivy-*-release.sarif
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Grype SARIFs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: grype-sarifs
          path: grype-*-release.sarif
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Snyk container SARIFs
        if: always() && inputs.enable_snyk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: snyk-container-sarifs
          path: snyk-container-*.sarif
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Dockle reports
        if: always() && inputs.enable_dockle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dockle-reports
          path: |
            dockle-*-report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Trivy backend SARIF to code scanning
        if: inputs.enable_code_scanning && steps.trivy_backend_image.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: trivy-backend-release.sarif
          category: trivy-backend-release

      - name: Upload Trivy frontend SARIF to code scanning
        if: inputs.enable_code_scanning && steps.trivy_frontend_image.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: trivy-frontend-release.sarif
          category: trivy-frontend-release

      - name: Upload Grype backend SARIF to code scanning
        if: inputs.enable_code_scanning && hashFiles('grype-backend-release.sarif') != ''
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: grype-backend-release.sarif
          category: grype-backend-release

      - name: Upload Grype frontend SARIF to code scanning
        if: inputs.enable_code_scanning && hashFiles('grype-frontend-release.sarif') != ''
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: grype-frontend-release.sarif
          category: grype-frontend-release

      - name: Upload Snyk container SARIF to code scanning (backend)
        if: inputs.enable_code_scanning && hashFiles('snyk-container-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: snyk-container-backend.sarif
          category: snyk-container-backend

      - name: Upload Snyk container SARIF to code scanning (frontend)
        if: inputs.enable_code_scanning && hashFiles('snyk-container-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e
        with:
          sarif_file: snyk-container-frontend.sarif
          category: snyk-container-frontend

      - name: Evaluate image security scans
        if: always() && inputs.enforce_policies
        env:
          BUILD_BACKEND: ${{ needs.detect.outputs.build_backend_image }}
          BUILD_FRONTEND: ${{ needs.detect.outputs.build_frontend_image }}

          TRIVY_BACKEND_COUNT: ${{ steps.trivy_backend_image.outputs.vuln_count }}
          TRIVY_FRONTEND_COUNT: ${{ steps.trivy_frontend_image.outputs.vuln_count }}

          GRYPE_BACKEND_EXIT: ${{ steps.grype_backend_image.outputs.exit_code }}
          GRYPE_FRONTEND_EXIT: ${{ steps.grype_frontend_image.outputs.exit_code }}

          DOCKLE_BACKEND_EXIT: ${{ steps.dockle_backend_image.outputs.exit_code }}
          DOCKLE_FRONTEND_EXIT: ${{ steps.dockle_frontend_image.outputs.exit_code }}

          SNYK_CONTAINER_BACKEND_OUTCOME: ${{ steps.snyk_container_backend.outcome }}
          SNYK_CONTAINER_FRONTEND_OUTCOME: ${{ steps.snyk_container_frontend.outcome }}
        run: |
          failures=0

          if [ "${BUILD_BACKEND}" = "true" ] && [ "${TRIVY_BACKEND_COUNT:-0}" -ne 0 ]; then
            echo "::error::Backend image scan found CRITICAL/HIGH vulns (count=${TRIVY_BACKEND_COUNT})"
            failures=1
          fi

          if [ "${BUILD_FRONTEND}" = "true" ] && [ "${TRIVY_FRONTEND_COUNT:-0}" -ne 0 ]; then
            echo "::error::Frontend image scan found CRITICAL/HIGH vulns (count=${TRIVY_FRONTEND_COUNT})"
            failures=1
          fi

          if [ "${BUILD_BACKEND}" = "true" ] && [ "${GRYPE_BACKEND_EXIT:-0}" -ne 0 ]; then            echo "::error::Grype backend failed policy"
            failures=1
          fi

          if [ "${BUILD_FRONTEND}" = "true" ] && [ "${GRYPE_FRONTEND_EXIT:-0}" -ne 0 ]; then
            echo "::error::Grype frontend failed policy"
            failures=1
          fi

          if [ "${{ inputs.enable_dockle }}" = "true" ]; then
            if [ "${BUILD_BACKEND}" = "true" ] && [ "${DOCKLE_BACKEND_EXIT:-0}" -ne 0 ]; then
              echo "::error::Dockle backend failed threshold (${DOCKLE_SEVERITY})"
              failures=1
            fi
            if [ "${BUILD_FRONTEND}" = "true" ] && [ "${DOCKLE_FRONTEND_EXIT:-0}" -ne 0 ]; then
              echo "::error::Dockle frontend failed threshold (${DOCKLE_SEVERITY})"
              failures=1
            fi
          fi

          if [ "${{ inputs.enable_snyk }}" = "true" ]; then
            if [ "${BUILD_BACKEND}" = "true" ] && [ "${SNYK_CONTAINER_BACKEND_OUTCOME}" = "failure" ]; then
              echo "::error::Snyk container backend failed policy"
              failures=1
            fi
            if [ "${BUILD_FRONTEND}" = "true" ] && [ "${SNYK_CONTAINER_FRONTEND_OUTCOME}" = "failure" ]; then
              echo "::error::Snyk container frontend failed policy"
              failures=1
            fi
          fi

          if [ "$failures" -ne 0 ]; then exit 1; fi

      - name: Sign backend image
        if: inputs.enable_image_signing && needs.detect.outputs.build_backend_image == 'true'
        run: |
          REF="${{ needs.build-and-push-images.outputs.backend_repo }}@${{ needs.build-and-push-images.outputs.backend_digest }}"
          cosign sign --yes \
            --annotations build-timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotations git-sha="${{ env.IMAGE_TAG }}" \
            --annotations workflow-run="${{ github.run_id }}" \
            --annotations github-ref="${{ github.ref }}" \
            "$REF"

      - name: Sign frontend image
        if: inputs.enable_image_signing && needs.detect.outputs.build_frontend_image == 'true'
        run: |
          REF="${{ needs.build-and-push-images.outputs.frontend_repo }}@${{ needs.build-and-push-images.outputs.frontend_digest }}"
          cosign sign --yes \
            --annotations build-timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotations git-sha="${{ env.IMAGE_TAG }}" \
            --annotations workflow-run="${{ github.run_id }}" \
            --annotations github-ref="${{ github.ref }}" \
            "$REF"

      - name: Verify backend signature
        if: inputs.enable_image_signing && needs.detect.outputs.build_backend_image == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.backend_repo }}@${{ needs.build-and-push-images.outputs.backend_digest }}"

          IDENTITY="https://github.com/${GITHUB_WORKFLOW_REF}"

          printf 'Expected identity: %q\n' "$IDENTITY"
          cosign verify "$REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "${{ inputs.expected_signing_identity }}" \
            >/dev/null

      - name: Verify frontend signature
        if: inputs.enable_image_signing && needs.detect.outputs.build_frontend_image == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ needs.build-and-push-images.outputs.frontend_repo }}@${{ needs.build-and-push-images.outputs.frontend_digest }}"

          IDENTITY="https://github.com/${GITHUB_WORKFLOW_REF}"

          printf 'Expected identity: %q\n' "$IDENTITY"
          cosign verify "$REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "${{ inputs.expected_signing_identity }}" \
            >/dev/null

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect, build-and-push-images, image-security-scan]
    if: ${{ always()
      && needs.detect.outputs.build_any_image == 'true'
      && needs.build-and-push-images.result == 'success'
      && needs.image-security-scan.result == 'success'
      }}
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Debug smoke-test gate values
        if: always()
        run: |
          echo "build_any_image='${{ needs.detect.outputs.build_any_image }}'"
          echo "build-and-push-images.result='${{ needs.build-and-push-images.result }}'"
          echo "image-security-scan.result='${{ needs.image-security-scan.result }}'"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Backend smoke test
        if: needs.detect.outputs.build_backend_image == 'true'
        run: |
          set -euo pipefail
          docker pull "${{ needs.build-and-push-images.outputs.backend_image_name }}"
          docker run -d --rm --name backend-smoke-test -p 8088:8088 "${{ needs.build-and-push-images.outputs.backend_image_name }}"
          for i in {1..30}; do
            if curl -fsS http://localhost:8088/actuator/health >/dev/null 2>&1; then
              docker stop backend-smoke-test >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 2
          done
          docker logs backend-smoke-test || true
          docker stop backend-smoke-test >/dev/null 2>&1 || true
          exit 1

      - name: Frontend smoke test
        if: needs.detect.outputs.build_frontend_image == 'true'
        run: |
          set -euo pipefail
          docker pull "${{ needs.build-and-push-images.outputs.frontend_image_name }}"
          docker run -d --rm --name frontend-smoke-test -p 8080:80 "${{ needs.build-and-push-images.outputs.frontend_image_name }}"
          for i in {1..30}; do
            if curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              docker stop frontend-smoke-test >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 2
          done
          docker logs frontend-smoke-test || true
          docker stop frontend-smoke-test >/dev/null 2>&1 || true
          exit 1

      - name: Clean up test containers
        if: always()
        run: |
          docker stop backend-smoke-test frontend-smoke-test >/dev/null 2>&1 || true

  promote-to-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect, build-and-push-images, image-security-scan, smoke-test]
    if: inputs.promote_to_latest == true && github.ref_name == github.event.repository.default_branch && needs.detect.outputs.build_any_image == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Promote backend to latest 
        if: needs.detect.outputs.build_backend_image == 'true'
        run: |
          set -euo pipefail
          REPO="${{ needs.build-and-push-images.outputs.backend_repo }}"
          DIGEST="${{ needs.build-and-push-images.outputs.backend_digest }}"
          docker buildx imagetools create -t "${REPO}:latest" "${REPO}@${DIGEST}"

      - name: Promote frontend to latest
        if: needs.detect.outputs.build_frontend_image == 'true'
        run: |
          set -euo pipefail
          REPO="${{ needs.build-and-push-images.outputs.frontend_repo }}"
          DIGEST="${{ needs.build-and-push-images.outputs.frontend_digest }}"
          docker buildx imagetools create -t "${REPO}:latest" "${REPO}@${DIGEST}"

  release-summary:
    runs-on: ubuntu-latest
    needs:
      [
        detect,
        pre-release-security,
        license-compliance,
        supply-chain-security,
        build-and-push-images,
        image-security-scan,
        smoke-test,
        promote-to-latest,
      ]
    if: always()
    permissions:
      contents: read
      actions: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Download all artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate consolidated security report (from downloaded artifacts)
        if: always()
        run: |
          set -euo pipefail
          echo "# Consolidated Security Report" > consolidated-report.md
          echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> consolidated-report.md
          echo "Run: ${{ github.run_number }}" >> consolidated-report.md
          echo "Branch: ${{ github.ref_name }}" >> consolidated-report.md
          echo "Image Tag (sha): ${{ env.IMAGE_TAG }}" >> consolidated-report.md
          echo "" >> consolidated-report.md

          count_sarif () {
            local file="$1"
            jq -r '[.runs[].results? // []] | map(length) | add // 0' "$file" 2>/dev/null || echo "0"
          }

          echo "## SARIF Findings" >> consolidated-report.md
          total=0
          while IFS= read -r -d '' f; do
            c=$(count_sarif "$f")
            total=$((total + c))
            echo "- $(basename "$f"): $c" >> consolidated-report.md
          done < <(find artifacts -type f -name "*.sarif" -print0 2>/dev/null || true)

          echo "" >> consolidated-report.md
          echo "**Total SARIF findings:** $total" >> consolidated-report.md
          echo "" >> consolidated-report.md

          echo "## Images" >> consolidated-report.md
          if [ "${{ needs.detect.outputs.build_backend_image }}" = "true" ]; then
            echo "- Backend: ${{ needs.build-and-push-images.outputs.backend_image_name }}" >> consolidated-report.md
            echo "  - Digest: ${{ needs.build-and-push-images.outputs.backend_digest }}" >> consolidated-report.md
          fi
          if [ "${{ needs.detect.outputs.build_frontend_image }}" = "true" ]; then
            echo "- Frontend: ${{ needs.build-and-push-images.outputs.frontend_image_name }}" >> consolidated-report.md
            echo "  - Digest: ${{ needs.build-and-push-images.outputs.frontend_digest }}" >> consolidated-report.md
          fi

          cat consolidated-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: consolidated-security-report
          path: consolidated-report.md
          retention-days: 90
          if-no-files-found: warn

      - name: Generate release summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'

          # Application Release Pipeline Results

          ## Detected Components
          - Backend present: ${{ needs.detect.outputs.has_backend }}
          - Frontend present: ${{ needs.detect.outputs.has_frontend }}
          - Backend image built: ${{ needs.detect.outputs.build_backend_image }}
          - Frontend image built: ${{ needs.detect.outputs.build_frontend_image }}

          ## Pipeline Status
          | Stage | Status | Details |
          |-------|--------|---------|
          | Pre-release Security | ${{ needs.pre-release-security.result }} | SAST, secrets, dependency scans |
          | License Compliance | ${{ needs.license-compliance.result }} | License checks |
          | Supply Chain Security | ${{ needs.supply-chain-security.result }} | Scorecard, dependency review |
          | Build & Push Images | ${{ needs.build-and-push-images.result }} | Multi-arch: ${{ inputs.enable_multi_arch }} |
          | Image Security Scan | ${{ needs.image-security-scan.result }} | Trivy + Grype + SBOM + Cosign |
          | Smoke Tests | ${{ needs.smoke-test.result }} | Health checks and accessibility |
          | Promote to Latest | ${{ needs.promote-to-latest.result }} | ${{ inputs.promote_to_latest && github.ref_name == github.event.repository.default_branch && 'Enabled' || 'Skipped' }} |

          ## Security Features
          - SBOM Generation: ${{ inputs.enable_sbom_generation && 'Enabled (CycloneDX + SPDX)' || 'Disabled' }}
          - Image Signing: ${{ inputs.enable_image_signing && 'Enabled (Cosign keyless)' || 'Disabled' }}
          - Multi-arch Builds: ${{ inputs.enable_multi_arch && 'Enabled (amd64 + arm64)' || 'Disabled' }}
          - SLSA Provenance: ${{ inputs.enable_slsa_provenance && 'Enabled (Level 2+)' || 'Disabled' }}
          - Dockle Scanning: ${{ inputs.enable_dockle && 'Enabled (Best Practices)' || 'Disabled' }}
          - Dive Analysis: ${{ inputs.enable_dive && 'Enabled (Layer Analysis)' || 'Disabled' }}
          - Dependency-Track: ${{ inputs.enable_dependency_track && 'Enabled' || 'Disabled' }}
          - Code Scanning: ${{ inputs.enable_code_scanning && 'Enabled (SARIF upload)' || 'Disabled' }}
          - Comprehensive SAST: ${{ inputs.run_comprehensive_sast && 'Enabled (Semgrep)' || 'Disabled' }}
          - Snyk Scanning: ${{ inputs.enable_snyk && 'Enabled' || 'Disabled' }}
          - Socket.dev: ${{ inputs.enable_socket && 'Enabled (Supply Chain)' || 'Disabled' }}
          - OWASP Dependency-Check: ${{ inputs.enable_owasp_dependency_check && 'Enabled' || 'Disabled' }}
          - Secrets Scanning: ${{ inputs.enable_secrets_scanning && 'Enabled (Gitleaks + TruffleHog + Trivy)' || 'Disabled' }}
          - License Compliance: ${{ inputs.enable_license_compliance && 'Enabled' || 'Disabled' }}
          - Supply Chain Security: ${{ inputs.enable_supply_chain_security && 'Enabled (Scorecard + Dependency Review)' || 'Disabled' }}
          - Policy Enforcement: ${{ inputs.enforce_policies && 'Strict' || 'Advisory' }}

          ## Artifacts Generated
          - Consolidated Security Report: `consolidated-report.md` (artifact: `consolidated-security-report`)
          EOF

          if [ "${{ needs.detect.outputs.build_backend_image }}" = "true" ]; then
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          - Backend Image: \`${{ needs.build-and-push-images.outputs.backend_image_name }}\`
            - Digest: \`${{ needs.build-and-push-images.outputs.backend_digest || 'N/A' }}\`
          EOF
          fi

          if [ "${{ needs.detect.outputs.build_frontend_image }}" = "true" ]; then
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          - Frontend Image: \`${{ needs.build-and-push-images.outputs.frontend_image_name }}\`
            - Digest: \`${{ needs.build-and-push-images.outputs.frontend_digest || 'N/A' }}\`
          EOF
          fi

          cat >> $GITHUB_STEP_SUMMARY <<'EOF'

          ## Scan Results Summary
          - Pre-release security scan: ${{ needs.pre-release-security.result }}
          - License compliance: ${{ needs.license-compliance.result }}
          - Supply chain security: ${{ needs.supply-chain-security.result }}
          - Container image scans: ${{ needs.image-security-scan.result }}
          - Smoke tests: ${{ needs.smoke-test.result }}

          ## Tags Created
          - SHA Tag: \`${{ env.IMAGE_TAG }}\`
          EOF

          if [ "${{ inputs.promote_to_latest }}" = "true" ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          - Latest Tag: Promoted (default branch only)
          EOF
          else
            cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          - Latest Tag: Not promoted (disabled or not default branch)
          EOF
          fi

          cat >> $GITHUB_STEP_SUMMARY <<EOF

          ---
          Release pipeline completed on \`${{ github.ref_name }}\` at \`$(date -u +"%Y-%m-%d %H:%M:%S UTC")\`
          Workflow Run: \`${{ github.run_number }}\`
          See Consolidated Security Report above for detailed findings.
          EOF


      - name: Check release pipeline success
        if: inputs.enforce_policies
        env:
          PRE_RELEASE_SECURITY_RESULT: ${{ needs.pre-release-security.result }}
          LICENSE_COMPLIANCE_RESULT: ${{ needs.license-compliance.result }}
          SUPPLY_CHAIN_SECURITY_RESULT: ${{ needs.supply-chain-security.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-security-scan.result }}
          SMOKE_TEST_RESULT: ${{ needs.smoke-test.result }}
        run: |
          failures=0
          if [ "${PRE_RELEASE_SECURITY_RESULT}" = "failure" ]; then failures=1; fi
          if [ "${LICENSE_COMPLIANCE_RESULT}" = "failure" ]; then failures=1; fi
          if [ "${SUPPLY_CHAIN_SECURITY_RESULT}" = "failure" ]; then failures=1; fi
          if [ "${IMAGE_SCAN_RESULT}" = "failure" ]; then failures=1; fi
          if [ "${SMOKE_TEST_RESULT}" = "failure" ]; then failures=1; fi
          if [ "$failures" -ne 0 ]; then exit 1; fi
